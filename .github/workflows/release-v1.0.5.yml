name: release-v1.0.5

on:
  push:
    paths:
      - '.github/workflows/release-v1.0.5.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: caa9f663ec7c900831a0b09d25f0988951e6c71e
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=v1.0.5" -o fanout .
      - name: Package
        run: |
          tar czf "fanout-linux-${{ matrix.goarch }}.tar.gz" fanout f.sh fanout.service
      - uses: actions/upload-artifact@v4
        with:
          name: fanout-linux-${{ matrix.goarch }}
          path: fanout-linux-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum fanout-linux-*.tar.gz > checksums.txt
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.5
          target_commitish: caa9f663ec7c900831a0b09d25f0988951e6c71e
          files: |
            fanout-linux-*.tar.gz
            checksums.txt
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
