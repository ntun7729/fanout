name: release-v1.0.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.0.3.yml'

permissions:
  contents: write

env:
  RELEASE_TAG: v1.0.3
  RELEASE_SHA: 47fa7f2932191ba2caa86ea1cc64c2f28bfc4dc6

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: linux
          CGO_ENABLED: '0'
        run: |
          GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o fanout .
      - name: Package
        run: |
          tar czf "fanout-linux-${{ matrix.goarch }}.tar.gz" fanout f.sh fanout.service
      - uses: actions/upload-artifact@v4
        with:
          name: fanout-linux-${{ matrix.goarch }}
          path: fanout-linux-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum fanout-linux-*.tar.gz > checksums.txt
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_SHA }}
          files: |
            fanout-linux-*.tar.gz
            checksums.txt
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
